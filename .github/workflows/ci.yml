name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'desktop/**', 'next.config.ts', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        run: npm run check

      - name: Build production application
        run: npm run build

  docker:
    name: Docker build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: po-agent:ci
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

      - name: Verify dynamically loaded runtime dependencies
        shell: bash
        run: |
          docker run --rm --entrypoint node po-agent:ci --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";

            const runtimeRoot = process.cwd();
            const pending = [
              path.join(runtimeRoot, "node_modules", "pi-web-access"),
              path.join(runtimeRoot, "node_modules", "@earendil-works", "pi-ai"),
              path.join(runtimeRoot, "node_modules", "@earendil-works", "pi-coding-agent"),
            ];
            const visited = new Set();
            while (pending.length > 0) {
              const packageRoot = pending.pop();
              const packageJsonPath = path.join(packageRoot, "package.json");
              const realPackageJsonPath = fs.realpathSync(packageJsonPath);
              if (visited.has(realPackageJsonPath)) continue;
              visited.add(realPackageJsonPath);
              const packageJson = JSON.parse(fs.readFileSync(realPackageJsonPath, "utf8"));
              for (const dependency of Object.keys(packageJson.dependencies ?? {})) {
                let searchRoot = packageRoot;
                let dependencyRoot;
                while (true) {
                  const candidate = path.join(searchRoot, "node_modules", dependency);
                  if (fs.existsSync(path.join(candidate, "package.json"))) {
                    dependencyRoot = candidate;
                    break;
                  }
                  if (searchRoot === runtimeRoot) break;
                  searchRoot = path.dirname(searchRoot);
                }
                if (!dependencyRoot) {
                  throw new Error(`Missing runtime dependency ${dependency} required by ${packageJson.name}`);
                }
                pending.push(dependencyRoot);
              }
            }
          '

      - name: Load bundled Web Access extension
        shell: bash
        run: |
          docker run --rm --entrypoint node po-agent:ci --input-type=module -e '
            import fs from "node:fs/promises";
            import os from "node:os";
            import path from "node:path";
            import { DefaultResourceLoader, SettingsManager } from "@earendil-works/pi-coding-agent";

            const agentDir = await fs.mkdtemp(path.join(os.tmpdir(), "po-agent-web-access-"));
            try {
              await fs.writeFile(path.join(agentDir, "web-search.json"), JSON.stringify({
                workflow: "none",
                allowBrowserCookies: false,
                tools: {
                  webSearch: { enabled: true },
                  fetchContent: { enabled: true },
                  getSearchContent: { enabled: true },
                  sourceCheck: { enabled: true },
                },
                fetchRouting: { providers: ["http", "jina"], allowRemoteHostedProviders: false },
                githubClone: { enabled: false },
                youtube: { enabled: false },
                video: { enabled: false },
                image: { enabled: false },
              }));
              const cwd = process.cwd();
              const loader = new DefaultResourceLoader({
                cwd,
                agentDir,
                settingsManager: SettingsManager.create(cwd, agentDir),
                additionalExtensionPaths: [path.join(cwd, "node_modules", "pi-web-access")],
              });
              await loader.reload();
              const extension = loader.getExtensions().extensions.find((item) => item.resolvedPath.includes("pi-web-access"));
              const requiredTools = ["web_search", "fetch_content", "get_search_content", "source_check"];
              if (!extension || requiredTools.some((name) => !extension.tools.has(name))) {
                throw new Error(JSON.stringify(loader.getExtensions().errors));
              }
            } finally {
              await fs.rm(agentDir, { recursive: true, force: true });
            }
          '

      - name: Start container
        run: docker run --detach --name po-agent-ci --publish 51732:51732 po-agent:ci

      - name: Wait for application response
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:51732/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready within 60 seconds."
          exit 1

      - name: Collect logs and remove container
        if: always()
        shell: bash
        run: |
          docker logs po-agent-ci || true
          docker rm --force po-agent-ci || true

  windows-package:
    name: Windows package smoke build
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Restore desktop build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}\.next\cache
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-desktop-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'desktop/**', 'resources/**', 'next.config.ts', 'package.json') }}
          restore-keys: |
            windows-desktop-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build unpacked Windows application
        run: npm run desktop:pack

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $executable = ".desktop-dist\win-unpacked\Po Agent.exe"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "Windows executable was not generated: $executable"
          }
